name: Build Windows EXE (Win7+)

# 触发方式：打 tag（自动发 Release）／手动点击 Run workflow／推送 main
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.tag }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # win32 版在 32 位和 64 位 Win7 上都能跑，兼容性最好，作为默认分发版本
          - arch: x86
            tag: win32
            ucrt: x86
          # win64 版仅供 64 位系统使用，性能略好
          - arch: x64
            tag: win64
            ucrt: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Win7 只能吃 Python 3.8（3.9 起官方最低 Win8.1）。
      # 必须写全 3.8.10：Python 官方只给 3.8.10 出了 Windows 安装包，写 '3.8' 会解析到
      # 无 Windows 二进制的 3.8.1x 而报 "Version 3.8 was not found"。
      - name: Setup Python 3.8.10 ${{ matrix.arch }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: ${{ matrix.arch }}

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.22.3"

      # 先确认 runner 的 Python 自带 Tcl/Tk，否则打出来的包在别人机器上会报 Tcl/Tk initialization failed
      - name: Verify tkinter
        run: python -c "import sys, tkinter; print(sys.version); print('Tk', tkinter.TkVersion)"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $pyArgs = @(
            '--noconfirm',
            '--clean',
            '--onefile',
            '--noconsole',
            '--name', 'BeatHeart',
            '--log-level', 'INFO'
          )

          # Win7 SP1 若没装 KB2999226，会缺 api-ms-win-crt-*.dll / ucrtbase.dll。
          # 从 runner 上的 Windows SDK 里把 UCRT 一并塞进 exe，目标机就不用再装补丁。
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Redist'
          if (Test-Path $kits) {
            $ver = Get-ChildItem $kits -Directory -ErrorAction SilentlyContinue |
                   Sort-Object Name -Descending |
                   Select-Object -First 1
            if ($ver) {
              $dllDir = Join-Path $ver.FullName "ucrt\DLLs\${{ matrix.ucrt }}"
              if (Test-Path $dllDir) {
                Get-ChildItem $dllDir -Filter *.dll | ForEach-Object {
                  $pyArgs += @('--add-binary', "$($_.FullName);.")
                }
                Write-Host "UCRT bundled from: $dllDir"
              } else {
                Write-Host "UCRT dir not found, skip: $dllDir"
              }
            }
          } else {
            Write-Host "Windows Kits not found, skip UCRT bundling"
          }

          $pyArgs += 'beat_heart.py'
          Write-Host "pyinstaller $($pyArgs -join ' ')"
          python -m PyInstaller @pyArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test (exe exists + hash)
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/BeatHeart.exe')) { throw 'dist/BeatHeart.exe not found' }
          Get-Item 'dist/BeatHeart.exe' | Select-Object Name, Length
          Get-FileHash 'dist/BeatHeart.exe' -Algorithm SHA256 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatHeart-${{ matrix.tag }}
          path: dist/BeatHeart.exe
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 打包成 zip 再发：微信/QQ/邮箱传裸 exe 常被拦，压缩包更容易过
      - name: Zip artifacts
        run: |
          cd artifacts
          for d in */; do
            (cd "$d" && zip -9 -r "../${d%/}.zip" .)
          done
          ls -lh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          body: |
            Windows 7 SP1 及以上可用。

            - `BeatHeart-win32.zip`：32 位版，32/64 位 Win7 都能运行，优先用这个
            - `BeatHeart-win64.zip`：64 位版，仅 64 位系统

            若提示缺少 `api-ms-win-crt-*.dll`，请安装 Win7 的 KB2999226 更新。
